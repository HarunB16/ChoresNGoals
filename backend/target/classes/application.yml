spring:
  application:
    name: choresngoals-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:choresngoals}
    username: ${POSTGRES_USER:choresngoals}
    password: ${POSTGRES_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  database:
    provider: postgresql
    host: ${POSTGRES_HOST:localhost}
    port: ${POSTGRES_PORT:5432}
    database: ${POSTGRES_DB:choresngoals}
    username: ${POSTGRES_USER:choresngoals}
    password: ${POSTGRES_PASSWORD:change-me}
