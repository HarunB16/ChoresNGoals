services:
  postgres:
    image: postgres:16-alpine
    container_name: choresngoals-postgres
    environment:
      POSTGRES_DB: choresngoals
      POSTGRES_USER: choresngoals
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U choresngoals -d choresngoals"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
